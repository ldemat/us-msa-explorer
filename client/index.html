<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!--
      Content Security Policy. GitHub Pages cannot set response headers, so the
      policy is delivered via meta tag. 'unsafe-inline' is allowed in style-src
      because Tailwind/Vite and Radix UI primitives inject runtime <style> tags
      and style="..." attributes (e.g. for portal positioning) that are not
      hashable at build time. All scripts and fonts are first-party.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>MSA Explorer · 387 U.S. Metropolitan Statistical Areas (2020-2025)</title>
    <meta name="description" content="Interactive directory and map of every U.S. Metropolitan Statistical Area with 2020-2025 Census Bureau population estimates, regions, divisions, and parent CSAs." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
